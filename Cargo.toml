[workspace]
members = [
    "crates/matching-engine",
    "crates/settlement",
    "crates/gateway",
    "crates/indexer",
    "crates/common",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MacBobby"]
license = "MIT"


[workspace.dependencies]
rust_decimal = "1.40.0"
uuid = { version = "1.20.0", features = ["v4"] }
