[workspace]
members = [
    "crates/matching-engine",
    "crates/settlement",
    "crates/gateway",
    "crates/indexer",
    "crates/common",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MacBobby"]
license = "MIT"


[workspace.dependencies]
rust_decimal = "1.40.0"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
