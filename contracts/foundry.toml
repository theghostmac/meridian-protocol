[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Solidity compiler settings
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 1_000_000
via_ir = true

# EVM target - Base
evm_version = "cancun"

# Fuzz settings
[profile.default.fuzz]
runs = 10_000 # high fuzz for financial contracts.
max_test_rejects = 65_536

# Gas reporting
gas_reports = ["*"]

# Invariant settings
[profile.default.invariant]
runs = 1_000
depth = 100
call_override = false

# CI profile - faster fuzzing runs for quick feedback.
[profile.ci]
fuzz = { runs = 1_000 }
invariant = { runs = 100 }

# Format settings.
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true
ignore = ["src/interfaces/**"]

# Remappings
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src,"
]


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
